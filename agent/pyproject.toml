[project]
name = "glovebox-agent"
version = "0.1.0"
description = "Glovebox voice agent: conversation only, all business rules live in the API."
requires-python = ">=3.11,<3.14"
# Pinned to releases about two weeks old; plugins must match livekit-agents exactly.
dependencies = [
  "livekit-agents==1.8.8",
  "livekit-plugins-deepgram==1.8.8",   # STT (Nova-3) and development TTS
  "livekit-plugins-google==1.8.8",     # Gemini via the Gemini API key
  "livekit-plugins-cartesia==1.8.8",   # TTS for recording
  "livekit-plugins-silero==1.8.8",     # voice activity detection
  "httpx==0.28.1",                     # typed API client
  "pydantic==2.14.1",                  # generated API models
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "respx==0.23.1",                     # mocks httpx in client tests
  "ruff==0.17.1",
  "datamodel-code-generator==0.85.0",  # api_models.py from api/schemas/api.schema.json
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glovebox_agent"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["glovebox_agent/api_models.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs a running API and real provider keys (run with -m live)"]
addopts = "-m 'not live'"
